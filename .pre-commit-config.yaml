repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        types_or: [ts, json]
      - id: hygiene
        name: no personal or system information
        entry: node scripts/hygiene.ts
        language: system
        exclude: ^(package-lock\.json|\.secrets\.baseline)$
      - id: hygiene-commit-msg
        name: no personal or system information in commit message
        entry: node scripts/hygiene.ts
        language: system
        stages: [commit-msg]
